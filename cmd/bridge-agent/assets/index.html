<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Bridge Agent</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: Canvas; color: CanvasText; }
      main { max-width: 1040px; margin: 0 auto; padding: 28px; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
      h1 { margin: 0; font-size: 24px; }
      .muted { color: color-mix(in srgb, CanvasText 60%, Canvas); }
      .card { margin-top: 20px; padding: 18px; border: 1px solid color-mix(in srgb, CanvasText 24%, Canvas); border-radius: 10px; }
      form, .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      input, select { min-width: 260px; padding: 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, CanvasText 30%, Canvas); background: Canvas; color: CanvasText; }
      .path-picker { display: flex; gap: 6px; align-items: center; }
      .path-picker input { min-width: 360px; }
      .tabs { display: flex; gap: 8px; margin-top: 20px; }
      .tabs button.active { background: #1d4ed8; }
      #profile-select { min-width: 180px; }
      button { padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer; background: #2563eb; color: white; }
      button.danger { background: #b91c1c; }
      button.secondary { background: color-mix(in srgb, CanvasText 20%, Canvas); color: CanvasText; }
      table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
      th, td { padding: 10px 8px; border-bottom: 1px solid color-mix(in srgb, CanvasText 16%, Canvas); text-align: left; vertical-align: top; }
      code { overflow-wrap: anywhere; } #status { min-height: 24px; margin-top: 14px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div><h1>Git Bridge Agent</h1><p class="muted">수동 Git bundle 전송 · MR/PR과 원격 push는 사용자가 직접 수행</p></div>
        <div class="actions"><select id="profile-select" aria-label="활성 프로젝트" hidden></select><button class="secondary" id="profile-add">프로젝트 추가</button><button class="secondary" id="profile-delete" hidden>프로젝트 삭제</button><button class="secondary" id="settings-toggle">설정</button><button class="secondary" id="refresh">수신함 새로고침</button></div>
      </header>
      <nav class="tabs" aria-label="전송 유형"><button id="git-tab" class="active">Git 전송</button><button id="file-tab" class="secondary">파일 전송</button></nav>
      <div id="git-panel">
      <section class="card" id="settings" hidden>
        <h2>Agent 설정</h2>
        <form id="settings-form">
          <input id="user-name" required placeholder="사용자명 (예: 홍길동)" />
          <input id="profile-name" required placeholder="프로필 이름 (예: logging)" />
          <input id="relay-url" required placeholder="https://relay.example.internal" />
          <input id="project-id" required placeholder="project-a" />
          <select id="network" aria-label="현재 네트워크"><option value="external">외부 개발망</option><option value="internal">내부 배포망</option></select>
          <div class="path-picker"><input id="repository-path" required placeholder="Git 프로젝트 폴더" /><button type="button" class="secondary" id="repository-picker">폴더 선택</button></div>
          <input id="target-ref" required value="main" placeholder="main" />
          <button type="submit">설정 저장</button>
        </form>
      </section>
      <section class="card">
        <h2>브랜치 업로드</h2>
        <form id="upload-form"><input id="branch" required placeholder="feature/payment" /><button type="submit">상대 환경으로 업로드</button></form>
      </section>
      <section class="card">
        <h2>수신함</h2>
          <table><thead><tr><th>Source</th><th>Branch / Commit</th><th>Created / Expires</th><th>Size</th><th>사용자 이력</th><th>Action</th></tr></thead><tbody id="inbox"><tr><td colspan="6" class="muted">수신함을 조회하세요.</td></tr></tbody></table>
      </section>
      </div>
      <div id="file-panel" hidden>
        <section class="card">
          <h2>일반 파일 업로드</h2>
          <p class="muted">단일 파일만 전송합니다. 최대 500MiB이며 Relay에서 14일 후 자동 삭제됩니다.</p>
          <div class="actions"><button id="file-picker">파일 선택 및 상대 환경으로 업로드</button></div>
        </section>
        <section class="card">
          <h2>파일 수신함</h2>
          <table><thead><tr><th>Source</th><th>파일 / SHA-256</th><th>Created / Expires</th><th>Size</th><th>사용자 이력</th><th>Action</th></tr></thead><tbody id="file-inbox"><tr><td colspan="6" class="muted">파일 수신함을 조회하세요.</td></tr></tbody></table>
        </section>
      </div>
      <div id="status" role="status"></div>
    </main>
    <script type="importmap">{"imports":{"@wailsio/runtime":"/wails/runtime.js"}}</script>
    <script type="module">
      import { DesktopService } from "./bindings/bridge-agent/cmd/bridge-agent/index.js";
      const status = document.getElementById("status");
      const inbox = document.getElementById("inbox");
      const fileInbox = document.getElementById("file-inbox");
      const profileSelect = document.getElementById("profile-select");
      let editingNewProfile = false;
      const networkName = (network) => ({ external: "외부 개발망", internal: "내부 배포망" }[network] || network);
      const formatSize = (bytes) => bytes < 1024 * 1024 ? `${Math.ceil(bytes / 1024)} KiB` : `${(bytes / 1024 / 1024).toFixed(1)} MiB`;
      const displayUser = (name) => name || "알 수 없음";
      const formatHistory = (transfer) => {
        const downloads = transfer.downloads || [];
        const received = downloads.length === 0 ? "아직 없음" : downloads.map((download) => `${displayUser(download.userName)} (${new Date(download.downloadedAt).toLocaleString()})`).join("\n");
        return `업로드: ${displayUser(transfer.uploadedBy)}\n다운로드: ${received}`;
      };
      const showError = (error) => { status.textContent = `오류: ${error?.message || error}`; };
      const showStatus = (message) => { status.textContent = message; };
      function fillProfile(profile) {
        document.getElementById("profile-name").value = profile.name || "";
        document.getElementById("relay-url").value = profile.relayUrl || "";
        document.getElementById("project-id").value = profile.projectId || "";
        document.getElementById("network").value = profile.network || "external";
        document.getElementById("repository-path").value = profile.repositoryPath || "";
        document.getElementById("target-ref").value = profile.targetRef || "main";
      }
      function emptyProfile() {
        fillProfile({ name: "", relayUrl: "", projectId: "", network: "external", repositoryPath: "", targetRef: "main" });
      }
      async function loadConfig() {
        try {
          const store = await DesktopService.GetProfiles();
          profileSelect.replaceChildren();
          for (const profile of store.profiles) { const option = document.createElement("option"); option.value = profile.name; option.textContent = profile.name; profileSelect.append(option); }
          profileSelect.value = store.activeProfile;
          profileSelect.hidden = false;
          document.getElementById("profile-delete").hidden = false;
          const active = store.profiles.find((profile) => profile.name === store.activeProfile);
          document.getElementById("user-name").value = store.userName || "";
          fillProfile(active); editingNewProfile = false;
          if (!store.userName) { document.getElementById("settings").hidden = false; showStatus("전송 전에 사용자명을 설정하세요."); }
        } catch (_) { profileSelect.hidden = true; document.getElementById("profile-delete").hidden = true; editingNewProfile = true; emptyProfile(); document.getElementById("settings").hidden = false; }
      }
      async function refresh() {
        showStatus("수신함을 조회하는 중...");
        try {
          const transfers = await DesktopService.Inbox();
          inbox.replaceChildren();
          if (transfers.length === 0) inbox.innerHTML = '<tr><td colspan="6" class="muted">수신 대기 중인 전송이 없습니다.</td></tr>';
          for (const transfer of transfers) {
            const row = document.createElement("tr");
            row.innerHTML = `<td>${networkName(transfer.sourceNetwork)} → ${networkName(transfer.targetNetwork)}</td><td><code>${transfer.sourceRef}</code><br><code>${transfer.headSha}</code></td><td>${new Date(transfer.createdAt).toLocaleString()}<br>${new Date(transfer.expiresAt).toLocaleString()}</td><td>${formatSize(transfer.size)}</td><td></td><td class="actions"></td>`;
            row.children[4].textContent = formatHistory(transfer);
            const actions = row.lastElementChild;
            const download = document.createElement("button"); download.textContent = "Download 및 checkout";
            download.onclick = async () => { try { showStatus("bundle 검증 및 checkout 중..."); const result = await DesktopService.Download(transfer.id); showStatus(`완료: ${result.branch}\n이제 테스트 후 일반 git push로 GitLab/GitHub에 반영하세요.`); await refresh(); } catch (error) { showError(error); } };
            const remove = document.createElement("button"); remove.textContent = "삭제"; remove.className = "danger";
            remove.onclick = async () => { if (!confirm("이 전송을 relay에서 즉시 삭제할까요?")) return; try { await DesktopService.Delete(transfer.id); await refresh(); } catch (error) { showError(error); } };
            actions.append(download, remove); inbox.append(row);
          }
          showStatus(`수신함 ${transfers.length}건`);
        } catch (error) { showError(error); }
      }
      async function refreshFiles() {
        try {
          const files = await DesktopService.FileInbox();
          fileInbox.replaceChildren();
          if (files.length === 0) { fileInbox.innerHTML = '<tr><td colspan="6" class="muted">수신 대기 중인 파일이 없습니다.</td></tr>'; return; }
          for (const file of files) {
            const row = document.createElement("tr");
            const source = document.createElement("td"); source.textContent = `${networkName(file.sourceNetwork)} → ${networkName(file.targetNetwork)}`;
            const metadata = document.createElement("td"); const name = document.createElement("code"); name.textContent = file.filename; const hash = document.createElement("code"); hash.textContent = file.sha256; metadata.append(name, document.createElement("br"), hash);
            const dates = document.createElement("td"); dates.textContent = `${new Date(file.createdAt).toLocaleString()}\n${new Date(file.expiresAt).toLocaleString()}`;
            const size = document.createElement("td"); size.textContent = formatSize(file.size);
            const history = document.createElement("td"); history.textContent = formatHistory(file);
            const actions = document.createElement("td"); actions.className = "actions";
            const download = document.createElement("button"); download.textContent = "저장";
            download.onclick = async () => { try { const destination = await DesktopService.PickSavePath(file.filename); if (!destination) return; showStatus("파일을 검증하며 저장 중..."); await DesktopService.DownloadFile(file.id, destination); showStatus(`저장 완료: ${destination}`); await refreshFiles(); } catch (error) { showError(error); } };
            const remove = document.createElement("button"); remove.textContent = "삭제"; remove.className = "danger";
            remove.onclick = async () => { if (!confirm("이 파일을 Relay에서 즉시 삭제할까요?")) return; try { await DesktopService.DeleteFile(file.id); await refreshFiles(); } catch (error) { showError(error); } };
            actions.append(download, remove); row.append(source, metadata, dates, size, history, actions); fileInbox.append(row);
          }
        } catch (error) { showError(error); }
      }
      document.getElementById("refresh").onclick = async () => { showStatus("수신함을 조회하는 중..."); await Promise.all([refresh(), refreshFiles()]); };
      const selectPanel = (name) => { const git = name === "git"; document.getElementById("git-panel").hidden = !git; document.getElementById("file-panel").hidden = git; document.getElementById("git-tab").className = git ? "active" : "secondary"; document.getElementById("file-tab").className = git ? "secondary" : "active"; };
      document.getElementById("git-tab").onclick = () => selectPanel("git");
      document.getElementById("file-tab").onclick = async () => { selectPanel("file"); showStatus("파일 수신함을 조회하는 중..."); await refreshFiles(); };
      document.getElementById("settings-toggle").onclick = () => { const settings = document.getElementById("settings"); settings.hidden = !settings.hidden; };
      profileSelect.onchange = async () => {
        try { await DesktopService.SetActiveProfile(profileSelect.value); await loadConfig(); showStatus("활성 프로젝트를 변경했습니다."); await Promise.all([refresh(), refreshFiles()]); } catch (error) { showError(error); }
      };
      document.getElementById("profile-add").onclick = () => { editingNewProfile = true; emptyProfile(); document.getElementById("settings").hidden = false; document.getElementById("profile-name").focus(); };
      document.getElementById("profile-delete").onclick = async () => {
        const name = profileSelect.value;
        if (!confirm(`프로젝트 설정 '${name}'을(를) 삭제할까요? Relay 전송 파일과 로컬 Git 저장소는 삭제되지 않습니다.`)) return;
        try { await DesktopService.DeleteProfile(name); await loadConfig(); showStatus("프로젝트 설정을 삭제했습니다."); await Promise.all([refresh(), refreshFiles()]); } catch (error) { showError(error); }
      };
      document.getElementById("repository-picker").onclick = async () => {
        try {
          const input = document.getElementById("repository-path");
          const path = await DesktopService.PickRepositoryPath(input.value);
          if (path) input.value = path;
        } catch (error) { showError(error); }
      };
      document.getElementById("settings-form").onsubmit = async (event) => {
        event.preventDefault();
        try {
          const userName = document.getElementById("user-name").value;
          const profile = { name: document.getElementById("profile-name").value, relayUrl: document.getElementById("relay-url").value, projectId: document.getElementById("project-id").value, network: document.getElementById("network").value, repositoryPath: document.getElementById("repository-path").value, targetRef: document.getElementById("target-ref").value };
          if (editingNewProfile) await DesktopService.CreateProfile(profile); else await DesktopService.UpdateProfile(profileSelect.value, profile);
          await DesktopService.SetUserName(userName);
          await loadConfig(); document.getElementById("settings").hidden = true; showStatus("프로젝트 설정을 저장했습니다."); await Promise.all([refresh(), refreshFiles()]);
        } catch (error) { showError(error); }
      };
      document.getElementById("upload-form").onsubmit = async (event) => {
        event.preventDefault();
        try { showStatus("Git bundle 생성 및 업로드 중..."); const transfer = await DesktopService.Upload(document.getElementById("branch").value); showStatus(`업로드 완료: ${transfer.id}`); } catch (error) { showError(error); }
      };
      document.getElementById("file-picker").onclick = async () => {
        try { const path = await DesktopService.PickFilePath(); if (!path) return; showStatus("파일 업로드 중..."); const transfer = await DesktopService.UploadFile(path); showStatus(`파일 업로드 완료: ${transfer.filename} (${transfer.id})`); await refreshFiles(); } catch (error) { showError(error); }
      };
      loadConfig().then(refresh);
    </script>
  </body>
</html>
